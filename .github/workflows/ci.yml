name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Maven tests
        run: mvn -B -ntp test

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: allocation-web

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: allocation-web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:ci

      - name: Build frontend
        run: npm run build

  campaign-scripts:
    name: Benchmark campaign script checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run campaign helper tests
        run: python3 -m unittest scripts/test_benchmark_campaign_files.py

      - name: Check Bash syntax and extended dry run
        run: |
          bash -n scripts/run-benchmark-campaign.sh
          bash scripts/run-benchmark-campaign.sh --preset extended --dry-run --skip-tests

      - name: Test PowerShell campaign helpers
        shell: pwsh
        run: ./scripts/test-benchmark-campaign-functions.ps1

      - name: Check PowerShell standard dry run
        shell: pwsh
        run: ./scripts/run-benchmark-campaign.ps1 -Preset standard -DryRun -SkipTests

      - name: Run PowerShell smoke campaign
        shell: pwsh
        run: |
          $outputRoot = Join-Path $env:RUNNER_TEMP 'campaign output'
          ./scripts/run-benchmark-campaign.ps1 -Preset smoke -OutputRoot $outputRoot -SkipTests
          $manifest = Get-Content (Join-Path $outputRoot 'campaign-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.campaignStatus -ne 'COMPLETED') { throw 'Smoke campaign did not complete.' }
          if (@($manifest.experiments | Where-Object status -ne 'COMPLETED').Count -ne 0) {
            throw 'One or more smoke experiments did not complete.'
          }
          @('campaign-raw-results.csv', 'campaign-summary.csv', 'campaign-request-outcomes.csv') | ForEach-Object {
            if (-not (Test-Path (Join-Path $outputRoot $_) -PathType Leaf)) { throw "Missing combined file: $_" }
          }
          @('raw-results.csv', 'summary-results.csv', 'request-outcomes.csv', 'scenario-snapshots.json', 'metadata.json') |
            ForEach-Object {
              $path = Join-Path (Join-Path $outputRoot 'greedy-trap-validation') $_
              if (-not (Test-Path $path -PathType Leaf)) { throw "Missing experiment file: $_" }
            }
